# podlink profile: "chat" — the conversational voice-harness pod on ONE H200 (141 GB).
#
# Install: cp profiles/chat.conf ~/.config/podlink/profiles/chat.conf
# Launch:  ./start.sh --check --profile chat   (preflight, spends nothing)
#          ./start.sh --profile chat           (or pick "chat" in the console dropdown)
#
# Two-stage think (spec §5.5(b)): a fast MoE model speaks the first sentence while a
# 70B model reasons in the background. Speech (ASR/TTS), the helper LM and the harness
# gateway all live on the same pod, so nothing on the hot path crosses a network hop.
# The image is the chat pod image (chat/pod_image, layered on a HOPPER build of
# podlink's pod_image — the H200 is sm_90, so the stock sm_120 TEI binary won't run).
#
# Only `export PODLINK_*` lines are honoured (parsed, never executed). Fill in the
# the "<network-volume-id>" placeholder before the first POD UP (keep the quotes: start.sh sources this file).

# --- image + hardware --------------------------------------------------------
export PODLINK_IMAGE=ghcr.io/14mm47/chat-pod:latest
export PODLINK_GPU_MATCH="H200"
export PODLINK_GPU_MIN_VRAM_GB=140
export PODLINK_CONTAINER_DISK_GB=80
export PODLINK_POD_NAME=podlink-chat
export PODLINK_TEMPLATE_NAME=podlink-chat-pod
# A dedicated Network Volume (~200 GB) created in a data center that stocks H200
# Secure Cloud: 30B-A3B + 70B AWQ + helper + speech weights ≈ 65 GB, plus HF cache.
export PODLINK_NETWORK_VOLUME_ID="<network-volume-id>"
export PODLINK_VOLUME_GB=200
export PODLINK_AUTO_TERMINATE_MIN=60
# POD DOWN stops (container stays on its host: no image pull on the next POD UP); POD UP
# retries the resume 40x15s and only then terminates + recreates (weights on the volume).
export PODLINK_LIFECYCLE=stop
export PODLINK_RESUME_RETRIES=40
export PODLINK_RESUME_RETRY_DELAY=15

# --- services the image runs (name:port:health-path) -------------------------
# Order = start order in the pod and tile order in the console. Every port is
# proxied by RunPod and gated by the one pod_bearer_token.
export PODLINK_SERVICES="llm:8000:/v1/models,think:8001:/v1/models,helper:8002:/v1/models,embedder:8080:/health,reranker:8081:/health,asr:8090:/health,tts:8091:/health,harness:8100:/health"

# --- fast model = podlink's stock `llm` role (vLLM :8000) ----------------------
# ~18 GB AWQ weights + 16 GB KV at 0.24 of 141 GB. 3B active params -> >100 tok/s.
export PODLINK_LLM_MODEL_ID=stelterlab/Qwen3-30B-A3B-Instruct-2507-AWQ
export PODLINK_LLM_SERVED_NAME=fast
export PODLINK_LLM_QUANT=awq_marlin
export PODLINK_GPU_MEMORY_UTILIZATION=0.24
export PODLINK_MAX_MODEL_LEN=16384
export PODLINK_VLLM_EXTRA_ARGS="--enable-prefix-caching --kv-cache-dtype fp8 --max-num-seqs 16"

# --- retrieval (TEI :8080 / :8081) -------------------------------------------
export PODLINK_EMBED_MODEL_ID=BAAI/bge-m3
export PODLINK_RERANK_MODEL_ID=BAAI/bge-reranker-v2-m3

# --- extra services: PODLINK_POD_ENV_<KEY> lands in the pod env as <KEY> --------
# The image's entrypoint renders supervisord programs for exactly these, in order.
export PODLINK_POD_ENV_POD_SERVICES="embedder,reranker,asr,tts,think,llm,helper,harness"
# think model (vLLM :8001): ~38 GB AWQ weights + 22 GB KV at 0.43.
export PODLINK_POD_ENV_THINK_MODEL_ID=casperhansen/llama-3.3-70b-instruct-awq
export PODLINK_POD_ENV_THINK_SERVED_NAME=think
export PODLINK_POD_ENV_THINK_QUANT=awq_marlin
export PODLINK_POD_ENV_THINK_GPU_MEMORY_UTILIZATION=0.43
export PODLINK_POD_ENV_THINK_MAX_MODEL_LEN=16384
export PODLINK_POD_ENV_THINK_VLLM_EXTRA_ARGS="--enable-prefix-caching --kv-cache-dtype fp8 --max-num-seqs 8 --enforce-eager"
# helper LM (vLLM :8002): query rewriter, dialogue-state updates, summaries. ~6 GB.
export PODLINK_POD_ENV_HELPER_MODEL_ID=Qwen/Qwen3-1.7B
export PODLINK_POD_ENV_HELPER_SERVED_NAME=helper
export PODLINK_POD_ENV_HELPER_GPU_MEMORY_UTILIZATION=0.045
export PODLINK_POD_ENV_HELPER_MAX_MODEL_LEN=8192
export PODLINK_POD_ENV_HELPER_VLLM_EXTRA_ARGS="--max-num-seqs 8 --enforce-eager"
# vLLM compile/graph caches on the volume so a recreated pod skips torch.compile.
export PODLINK_POD_ENV_VLLM_CACHE_ROOT=/workspace/vllm_cache
# speech: streaming ASR with word timestamps (sherpa-onnx), Kokoro TTS.
export PODLINK_POD_ENV_ASR_MODEL_ID="csukuangfj/sherpa-onnx-streaming-zipformer-en-2023-06-26"
export PODLINK_POD_ENV_TTS_MODEL_ID=hexgrad/Kokoro-82M
