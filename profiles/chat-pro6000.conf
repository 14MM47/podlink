# podlink profile: "chat-pro6000" — the conversational voice-harness pod on ONE RTX PRO 6000
# (96 GB, Blackwell / sm_120).
#
# Install: cp profiles/chat-pro6000.conf ~/.config/podlink/profiles/chat-pro6000.conf
# Launch:  ./start.sh --check --profile chat-pro6000   (preflight, spends nothing)
#          ./start.sh --profile chat-pro6000           (or pick it in the console dropdown)
#
# The SAME architecture as profiles/chat.conf (the H200 pod): eight services, same order,
# same ports, same two-stage think (spec §5.5(b)), same harness. Only the model sizes
# differ, scaled to fit 96 GB:
#   fast   Qwen3-30B-A3B-Instruct-2507 AWQ  ->  Qwen3-8B AWQ
#   think  Llama 3.3 70B AWQ                ->  Qwen3-32B AWQ
#   helper Qwen3-1.7B                       ->  unchanged
# KV reserves are sized to hold about the same number of tokens as on the H200, so session
# capacity is not a second variable.
#
# Qwen3-8B / Qwen3-32B / Qwen3-1.7B are HYBRID thinking models (no 2507 Instruct release at
# these sizes): left alone they emit <think>…</think> before every answer, which breaks the
# first-sentence budget, the length-class max_tokens and the CONTINUE/CORRECT/SILENT parse.
# Every Qwen3 role therefore gets, server-side (the harness stays byte-identical):
#   --default-chat-template-kwargs {"enable_thinking":false}   empty think block prefilled
#   --override-generation-config {"top_p":0.8,"top_k":20}      Qwen's non-thinking sampling
#     (the repos' generation_config.json ships the thinking-mode top_p 0.95; the harness
#     sets temperature per request, so only top_p/top_k are overridden here)
# The JSON must stay free of spaces: start-vllm-role.sh splits *_VLLM_EXTRA_ARGS on
# whitespace. Single quotes keep the double quotes literal for both shlex and `source`.
#
# The image is the chat pod image (chat_RTXPRO6000/pod_image) layered on podlink's STOCK
# pod_image, which already targets sm_120 — no Hopper TEI swap.
#
# Only `export PODLINK_*` lines are honoured (parsed, never executed). Fill in the
# "<network-volume-id>" placeholder before the first POD UP (keep the quotes: start.sh sources this file).

# --- image + hardware --------------------------------------------------------
export PODLINK_IMAGE=ghcr.io/14mm47/chat-pod:pro6000
export PODLINK_GPU_MATCH="RTX PRO 6000"
export PODLINK_GPU_MIN_VRAM_GB=90
export PODLINK_CONTAINER_DISK_GB=80
export PODLINK_POD_NAME=podlink-chat-pro6000
export PODLINK_TEMPLATE_NAME=podlink-chat-pro6000-pod
# A dedicated Network Volume (~100 GB) created in a data center that stocks the RTX PRO 6000:
# 8B + 32B AWQ + helper + speech + retrieval weights ≈ 35 GB, plus HF cache and vLLM caches.
export PODLINK_NETWORK_VOLUME_ID="<network-volume-id>"
export PODLINK_VOLUME_GB=100
export PODLINK_AUTO_TERMINATE_MIN=60
# POD DOWN stops (container stays on its host: no image pull on the next POD UP); POD UP
# retries the resume 40x15s and only then terminates + recreates (weights on the volume).
export PODLINK_LIFECYCLE=stop
export PODLINK_RESUME_RETRIES=40
export PODLINK_RESUME_RETRY_DELAY=15

# --- services the image runs (name:port:health-path) -------------------------
# Identical to chat.conf.
export PODLINK_SERVICES="llm:8000:/v1/models,think:8001:/v1/models,helper:8002:/v1/models,embedder:8080:/health,reranker:8081:/health,asr:8090:/health,tts:8091:/health,harness:8100:/health"

# --- fast model = podlink's stock `llm` role (vLLM :8000) ----------------------
# ~6.1 GB AWQ weights + ~16 GB KV at 0.24 of 96 GB (fp8 KV at 72 KB/token ≈ 220k tokens).
export PODLINK_LLM_MODEL_ID=Qwen/Qwen3-8B-AWQ
export PODLINK_LLM_SERVED_NAME=fast
export PODLINK_LLM_QUANT=awq_marlin
export PODLINK_GPU_MEMORY_UTILIZATION=0.24
export PODLINK_MAX_MODEL_LEN=16384
export PODLINK_VLLM_EXTRA_ARGS='--enable-prefix-caching --kv-cache-dtype fp8 --max-num-seqs 16 --default-chat-template-kwargs {"enable_thinking":false} --override-generation-config {"top_p":0.8,"top_k":20}'

# --- retrieval (TEI :8080 / :8081) -------------------------------------------
export PODLINK_EMBED_MODEL_ID=BAAI/bge-m3
export PODLINK_RERANK_MODEL_ID=BAAI/bge-reranker-v2-m3

# --- extra services: PODLINK_POD_ENV_<KEY> lands in the pod env as <KEY> --------
# The image's entrypoint renders supervisord programs for exactly these, in order.
export PODLINK_POD_ENV_POD_SERVICES="embedder,reranker,asr,tts,think,llm,helper,harness"
# think model (vLLM :8001): ~19.3 GB AWQ weights + ~17 GB KV at 0.39 of 96 GB
# (fp8 KV at 128 KB/token ≈ 130k tokens; the H200's 70B holds ≈ 125k).
# No --enforce-eager: CUDA graphs took single-stream decode from 38 to 66 tok/s at M0
# (22 Sept 2026); the one-off compile (~5 min) is cached in VLLM_CACHE_ROOT.
export PODLINK_POD_ENV_THINK_MODEL_ID=Qwen/Qwen3-32B-AWQ
export PODLINK_POD_ENV_THINK_SERVED_NAME=think
export PODLINK_POD_ENV_THINK_QUANT=awq_marlin
export PODLINK_POD_ENV_THINK_GPU_MEMORY_UTILIZATION=0.39
export PODLINK_POD_ENV_THINK_MAX_MODEL_LEN=16384
export PODLINK_POD_ENV_THINK_VLLM_EXTRA_ARGS='--enable-prefix-caching --kv-cache-dtype fp8 --max-num-seqs 8 --default-chat-template-kwargs {"enable_thinking":false} --override-generation-config {"top_p":0.8,"top_k":20}'
# helper LM (vLLM :8002): query rewriter, dialogue-state updates, summaries. ~6.3 GB, the
# same GB as on the H200 (0.045 × 141).
export PODLINK_POD_ENV_HELPER_MODEL_ID=Qwen/Qwen3-1.7B
export PODLINK_POD_ENV_HELPER_SERVED_NAME=helper
export PODLINK_POD_ENV_HELPER_GPU_MEMORY_UTILIZATION=0.066
export PODLINK_POD_ENV_HELPER_MAX_MODEL_LEN=8192
export PODLINK_POD_ENV_HELPER_VLLM_EXTRA_ARGS='--max-num-seqs 8 --default-chat-template-kwargs {"enable_thinking":false} --override-generation-config {"top_p":0.8,"top_k":20}'
# vLLM compile/graph caches on the volume so a recreated pod skips torch.compile.
export PODLINK_POD_ENV_VLLM_CACHE_ROOT=/workspace/vllm_cache
# speech: streaming ASR with word timestamps (sherpa-onnx), Kokoro TTS. Identical to chat.conf.
# ASR on the CPU: sherpa-onnx 1.12.0's CUDA wheel links CUDA 11 (libcublasLt.so.11), which the
# CUDA 12.9 vLLM base lacks, so provider=cuda crash-loops and stalls every service after it.
# CPU is ample for a few streams; revisit with a CUDA 12 sherpa-onnx build before M5.
export PODLINK_POD_ENV_ASR_PROVIDER=cpu
export PODLINK_POD_ENV_ASR_MODEL_ID="csukuangfj/sherpa-onnx-streaming-zipformer-en-2023-06-26"
export PODLINK_POD_ENV_TTS_MODEL_ID=hexgrad/Kokoro-82M
