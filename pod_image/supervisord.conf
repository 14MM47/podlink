; supervisord config for the podlink bundled pod image.
; Runs the three co-resident services and streams their logs to the container
; stdout/stderr so they show up in the RunPod dashboard log view.

; Control socket so `supervisorctl -c /etc/podlink/supervisord.conf status|tail|restart <name>`
; works from the RunPod web terminal: a service that failed to start can be restarted in
; place instead of cycling the whole pod. Unix socket, owner-only, no TCP.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[supervisord]
nodaemon=true                 ; run in the foreground as the container's PID 1 stand-in
logfile=/dev/stdout           ; supervisor's own log -> container stdout
logfile_maxbytes=0            ; never rotate (0 = unlimited; RunPod captures the stream)
pidfile=/tmp/supervisord.pid

; Start order: the two TEI services first (priority 10/20), vLLM last (30). start-vllm.sh
; also waits for both TEI /health endpoints, so vLLM profiles its KV cache only once the
; embedder has taken its VRAM. startretries is raised from supervisor's default of 3: a
; service that fails three early starts (a slow weight download, a CUDA allocation while
; a neighbour is loading) would otherwise go FATAL and never listen, which podlink shows
; as one tile pending forever while the pod bills.

; --- Auth proxy: nginx on the public vLLM ports (started FIRST) ---
; vLLM's --api-key leaves its root routes (/tokenize, /rerank, /score, ...)
; unauthenticated, so vLLM binds 127.0.0.1 and nginx owns public :8000 (and :8081
; for a vllm reranker), requiring the bearer on every path but /health. Until a
; backend is up nginx answers 502, so the health waits keep waiting correctly.
[program:authproxy]
command=python3 /opt/podlink/authproxy.py
priority=5
autostart=true
autorestart=true
startretries=50
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- LLM: vLLM on 127.0.0.1:18000, public :8000 via authproxy (started last; it's the long pole and the big VRAM user) ---
[program:vllm]
command=/opt/podlink/start-vllm.sh
priority=30                   ; lower = started earlier
autostart=true
autorestart=true              ; restart if it crashes (e.g. transient CUDA error)
startretries=50               ; don't go FATAL on a few early failures
startsecs=30                  ; must stay up 30s to count as "started"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Embedder: TEI on :8080 (first: it must own its VRAM before vLLM profiles) ---
[program:embedder]
command=/opt/podlink/start-embedder.sh
priority=10
autostart=true
autorestart=true
startretries=50
startsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Reranker: TEI on :8081 ---
[program:reranker]
command=/opt/podlink/start-reranker.sh
priority=20
autostart=true
autorestart=true
startretries=50
startsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
