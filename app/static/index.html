<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>podlink — pod control</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.5rem; font-family: system-ui, -apple-system, sans-serif;
      background: #0f1115; color: #e7e9ee;
    }
    h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .02em; opacity: .8; margin: 0; }
    .buttons { display: flex; gap: 1.25rem; }
    button {
      width: 190px; height: 190px; border-radius: 20px; border: none;
      font-size: 1.35rem; font-weight: 700; cursor: pointer;
      transition: transform .08s ease, opacity .2s ease, filter .2s ease;
      color: #fff;
    }
    button:active:not(:disabled) { transform: scale(.97); }
    #up   { background: linear-gradient(160deg, #1e9e5a, #147a43); }
    #down { background: linear-gradient(160deg, #d64545, #a82f2f); }
    button:disabled { opacity: .28; cursor: not-allowed; filter: grayscale(.5); }
    .status {
      max-width: 460px; text-align: center; min-height: 3.2rem;
    }
    .state-badge {
      display: inline-block; padding: .18rem .6rem; border-radius: 999px;
      font-size: .78rem; font-weight: 700; letter-spacing: .05em;
      background: #2a2f3a;
    }
    .phase { margin-top: .5rem; font-size: .95rem; opacity: .85; }
    .error { margin-top: .5rem; font-size: .9rem; color: #ff8a8a; }
    .meta { margin-top: .35rem; font-size: .78rem; opacity: .5; word-break: break-all; }
  </style>
</head>
<body>
  <h1>podlink · phase 0 pod</h1>
  <div class="buttons">
    <button id="up">POD&nbsp;UP</button>
    <button id="down">POD&nbsp;DOWN</button>
  </div>
  <div class="status">
    <span id="badge" class="state-badge">…</span>
    <div id="phase" class="phase"></div>
    <div id="error" class="error"></div>
    <div id="meta" class="meta"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
