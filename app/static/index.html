<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>podlink — pod control</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.5rem; font-family: system-ui, -apple-system, sans-serif;
      background: #0f1115; color: #e7e9ee;
    }
    h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .02em; opacity: .8; margin: 0; }
    .buttons { display: flex; gap: 1.25rem; }
    button {
      width: 190px; height: 190px; border-radius: 20px; border: none;
      font-size: 1.35rem; font-weight: 700; cursor: pointer;
      transition: transform .08s ease, opacity .2s ease, filter .2s ease;
      color: #fff;
    }
    button:active:not(:disabled) { transform: scale(.97); }
    #up   { background: linear-gradient(160deg, #1e9e5a, #147a43); }
    #down { background: linear-gradient(160deg, #d64545, #a82f2f); }
    button:disabled { opacity: .28; cursor: not-allowed; filter: grayscale(.5); }
    .selector { display: flex; align-items: center; gap: .5rem; }
    .selector label { font-size: .8rem; opacity: .6; letter-spacing: .04em; }
    select {
      background: #1b1f27; color: #e7e9ee; border: 1px solid #2f3542;
      border-radius: 8px; padding: .45rem .6rem; font-size: .9rem; max-width: 420px;
    }
    select:disabled { opacity: .4; cursor: not-allowed; }
    button.mini {
      width: auto; height: auto; padding: .45rem .6rem; font-size: 1rem;
      border-radius: 8px; background: #2a2f3a; font-weight: 400;
    }
    button.mini:disabled { opacity: .4; }
    .status {
      max-width: 460px; text-align: center; min-height: 3.2rem;
    }
    .state-badge {
      display: inline-block; padding: .18rem .6rem; border-radius: 999px;
      font-size: .78rem; font-weight: 700; letter-spacing: .05em;
      background: #2a2f3a;
    }
    .phase { margin-top: .5rem; font-size: .95rem; opacity: .85; }
    .error { margin-top: .5rem; font-size: .9rem; color: #ff8a8a; }
    .meta { margin-top: .35rem; font-size: .78rem; opacity: .5; word-break: break-all; }
    .cost { margin-top: .5rem; font-size: .9rem; font-variant-numeric: tabular-nums; opacity: .9; }
    .cost b { color: #7fd7a2; }
    .autoterm {
      margin-top: .45rem; font-size: .85rem; display: none;
      align-items: center; justify-content: center; gap: .5rem;
      color: #ffcf8a; font-variant-numeric: tabular-nums;
    }
    .autoterm.show { display: flex; }
    /* Per-service health tiles */
    .tiles { display: none; gap: .5rem; margin-top: .8rem; justify-content: center; }
    .tiles.show { display: flex; }
    .tile {
      display: flex; align-items: center; gap: .4rem;
      background: #1b1f27; border: 1px solid #2f3542; border-radius: 8px;
      padding: .35rem .6rem; font-size: .8rem;
    }
    .tile .dot { width: .6rem; height: .6rem; border-radius: 50%; background: #6b7280; }
    .tile[data-status="healthy"] .dot { background: #2fbf71; box-shadow: 0 0 6px #2fbf7188; }
    .tile[data-status="pending"] .dot { background: #e6a740; }
    .tile[data-status="down"]    .dot { background: #d64545; }
    .tile[data-status="unknown"] .dot { background: #6b7280; }
    /* Streamed status event feed */
    .feed {
      display: none; margin-top: 1rem; width: min(460px, 92vw); max-height: 34vh;
      overflow-y: auto; background: #12151b; border: 1px solid #232833;
      border-radius: 8px; padding: .5rem .65rem; font-size: .78rem; line-height: 1.5;
      font-variant-numeric: tabular-nums;
    }
    .feed.show { display: block; }
    .feed-row { display: flex; gap: .6rem; opacity: .9; }
    .feed-row .ts { color: #6b7280; flex: 0 0 auto; }
    .feed-row .msg { word-break: break-word; }
    /* Shown only when no Network Volume is set: POD DOWN would destroy weights. */
    .volwarn {
      display: none; max-width: 460px; text-align: center; line-height: 1.4;
      background: #3a1f1f; color: #ffb4b4; border: 1px solid #7a2f2f;
      border-radius: 8px; padding: .55rem .8rem; font-size: .82rem;
    }
    .volwarn.show { display: block; }
    .volwarn code { font-size: .78rem; opacity: .85; }
  </style>
</head>
<body>
  <h1>podlink · phase 0 pod</h1>
  <div class="selector">
    <label for="podSelect">Target</label>
    <select id="podSelect">
      <option value="">Auto — create/resume the podlink pod</option>
    </select>
    <button id="refresh" class="mini" title="Refresh pod list">⟳</button>
  </div>
  <div id="volwarn" class="volwarn">
    ⚠ No RunPod <b>Network Volume</b> configured — <b>POD&nbsp;DOWN will terminate
    the pod and destroy the downloaded model weights</b>, so the next POD&nbsp;UP
    re-downloads ~36&nbsp;GB. Set <code>PODLINK_NETWORK_VOLUME_ID</code> to persist them.
  </div>
  <div class="buttons">
    <button id="up">POD&nbsp;UP</button>
    <button id="down">POD&nbsp;DOWN</button>
  </div>
  <div class="status">
    <span id="badge" class="state-badge">…</span>
    <div id="phase" class="phase"></div>
    <div id="error" class="error"></div>
    <div id="cost" class="cost"></div>
    <div id="autoterm" class="autoterm">
      <span id="autotermText"></span>
      <button id="keepalive" class="mini">Keep alive</button>
    </div>
    <div id="meta" class="meta"></div>
  </div>
  <div id="tiles" class="tiles">
    <div class="tile" data-status="unknown" id="tile-llm"><span class="dot"></span>LLM</div>
    <div class="tile" data-status="unknown" id="tile-embedder"><span class="dot"></span>embedder</div>
    <div class="tile" data-status="unknown" id="tile-reranker"><span class="dot"></span>reranker</div>
  </div>
  <div id="feed" class="feed"></div>
  <script src="/app.js"></script>
</body>
</html>
