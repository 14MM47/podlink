name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-runpod.txt -r requirements-gcp.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: |
          python tests/test_siloing.py
          python tests/test_driver_smoke.py
          python tests/test_gcp_provider.py
          python tests/test_gcp_tunnel.py
          python tests/test_session.py
          python tests/test_server.py
          python tests/test_authproxy.py
          python tests/test_pod_scripts.py
          python tests/test_lifecycle.py
